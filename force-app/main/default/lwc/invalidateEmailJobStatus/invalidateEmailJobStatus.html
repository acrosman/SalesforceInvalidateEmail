<template>
  <lightning-card title="Email Invalidator Jobs" icon-name="standard:job_profile">
    <div slot="actions">
      <lightning-button-icon icon-name="utility:refresh" alternative-text="Refresh" title="Refresh Job Status"
        onclick={handleRefreshClick}>
      </lightning-button-icon>
    </div>
    <div class="slds-m-around_medium">
      <template if:true={isLoading}>
        <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
      </template>

      <template if:true={error}>
        <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error" role="alert">
          <span class="slds-assistive-text">Error</span>
          <h2>Error loading job status: {error}</h2>
        </div>
      </template>

      <template if:true={hasData}>
        <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
          <p class="summary">{summary}</p>
          <p class="slds-text-color_weak">Last 7 days</p>
        </div>

        <template if:true={hasActiveJobs}>
          <div class="active-progress slds-m-bottom_small">
            <p class="slds-text-body_small slds-m-bottom_xx-small">
              Active progress: {activeProgress}% ({activeItemsProcessed} / {activeTotalItems} batches)
            </p>
            <lightning-progress-bar value={activeProgress} size="large"></lightning-progress-bar>
          </div>
        </template>

        <lightning-datatable key-field="jobId" data={jobs} columns={columns} hide-checkbox-column="true">
        </lightning-datatable>
      </template>

      <template if:true={showEmptyState}>
        <div class="slds-text-align_center slds-p-around_medium">
          <p class="slds-text-color_weak">No Email Invalidator jobs in the last 7 days.</p>
        </div>
      </template>
    </div>
  </lightning-card>
</template>
